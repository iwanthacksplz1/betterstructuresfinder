name: BSFinder
version: 1.0.0
main: com.example.bsfinder.BSFinderPlugin
api-version: '1.21'
softdepend: [BetterStructures]
commands:
  bsfind:
    description: Lists and teleports to structures generated by BetterStructures.
    usage: /bsfind <list|latest|tp <number>>
    permission: bsfind.use
permissions:
  bsfind.use:
    description: Allows use of the BSFinder commands.
    default: op
